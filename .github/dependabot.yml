version: 2
updates:
  # Keep SHA-pinned third-party actions current. Dependabot rewrites both the
  # SHA and the trailing `# vX` comment, so manual updates aren't needed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ESLint majors are blocked upstream and the PRs can only ever be red:
      # `eslint-plugin-react` (latest 7.37.5) still caps its peer range at
      # `eslint@^9.7`, so `npm ci` dies with ERESOLVE before any CI job runs.
      # On top of that ESLint 10 dropped `.eslintrc` support, which this repo
      # still uses. Both need to be resolved by hand — a flat-config migration
      # plus a react-plugin release that supports ESLint 10 — so drop this
      # ignore only when that work is actually being done. Minor and patch
      # updates keep flowing through the js-minor-patch group.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
